name: Build and Push Image

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag for image (leave empty to auto-tag based on branch/ref)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - idracadm7
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_OWNER="${REPO_OWNER,,}"
          DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          DOCKERHUB_USER="${DOCKERHUB_USER:-$REPO_OWNER}"
          DOCKERHUB_USER="${DOCKERHUB_USER,,}"
          REPO_NAME="idracadm7"

          # Extract ACME_VERSION from Dockerfile (e.g., 3.1.0)
          ACME_VER=$(grep -E '^ARG ACME_VERSION=' Dockerfile | cut -d'=' -f2 | tr -d '[:space:]"')

          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            # Manual tag input via workflow_dispatch
            TAG="${{ github.event.inputs.image_tag }}"
            TAGS=$(printf "%s/%s:%s\nghcr.io/%s/%s:%s" \
              "$DOCKERHUB_USER" "$REPO_NAME" "$TAG" \
              "$REPO_OWNER" "$REPO_NAME" "$TAG")
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Git tag push (e.g., v3.1.0)
            TAG="${{ github.ref_name }}"
            TAGS=$(printf "%s/%s:%s\nghcr.io/%s/%s:%s\n%s/%s:latest\nghcr.io/%s/%s:latest" \
              "$DOCKERHUB_USER" "$REPO_NAME" "$TAG" \
              "$REPO_OWNER" "$REPO_NAME" "$TAG" \
              "$DOCKERHUB_USER" "$REPO_NAME" \
              "$REPO_OWNER" "$REPO_NAME")
          elif [[ "${{ github.ref }}" == "refs/heads/idracadm7" ]]; then
            # Default branch build
            TAGS=$(printf "%s/%s:latest\nghcr.io/%s/%s:latest\n%s/%s:idracadm7\nghcr.io/%s/%s:idracadm7" \
              "$DOCKERHUB_USER" "$REPO_NAME" \
              "$REPO_OWNER" "$REPO_NAME" \
              "$DOCKERHUB_USER" "$REPO_NAME" \
              "$REPO_OWNER" "$REPO_NAME")
            if [ -n "$ACME_VER" ]; then
              TAGS=$(printf "%s\n%s/%s:%s\nghcr.io/%s/%s:%s" \
                "$TAGS" \
                "$DOCKERHUB_USER" "$REPO_NAME" "$ACME_VER" \
                "$REPO_OWNER" "$REPO_NAME" "$ACME_VER")
            fi
          else
            # Any other branch
            BRANCH_NAME="${{ github.ref_name }}"
            SAFE_BRANCH="${BRANCH_NAME//\//-}"
            TAGS=$(printf "%s/%s:%s\nghcr.io/%s/%s:%s" \
              "$DOCKERHUB_USER" "$REPO_NAME" "$SAFE_BRANCH" \
              "$REPO_OWNER" "$REPO_NAME" "$SAFE_BRANCH")
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Using tags:"
          echo "$TAGS"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
