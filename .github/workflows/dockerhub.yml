name: Build and Push Image

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag for image (leave empty to auto-tag based on branch/ref)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="acme.sh-idracadm7"
          TAGS=""
          
          # Manual tag input (workflow_dispatch)
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
            TAGS="${TAGS}${REPO_OWNER}/${REPO_NAME}:${TAG}
          ghcr.io/${REPO_OWNER}/${REPO_NAME}:${TAG}"
          else
            # Automatic tagging based on trigger type
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              # Tag event (e.g., v1.0.0)
              TAG="${{ github.ref_name }}"
              TAGS="${TAGS}${REPO_OWNER}/${REPO_NAME}:${TAG}
          ghcr.io/${REPO_OWNER}/${REPO_NAME}:${TAG}
          ${REPO_OWNER}/${REPO_NAME}:latest
          ghcr.io/${REPO_OWNER}/${REPO_NAME}:latest"
            elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
              # Main/master branch
              TAGS="${TAGS}${REPO_OWNER}/${REPO_NAME}:latest
          ghcr.io/${REPO_OWNER}/${REPO_NAME}:latest
          ${REPO_OWNER}/${REPO_NAME}:${{ github.ref_name }}
          ghcr.io/${REPO_OWNER}/${REPO_NAME}:${{ github.ref_name }}"
            else
              # Other branches
              BRANCH_NAME="${{ github.ref_name }}"
              TAGS="${TAGS}${REPO_OWNER}/${REPO_NAME}:${BRANCH_NAME}
          ghcr.io/${REPO_OWNER}/${REPO_NAME}:${BRANCH_NAME}"
            fi
          fi
          
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Using tags:"
          echo "$TAGS"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
