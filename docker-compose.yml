services:
  acme-sh:
    image: nicat23/idrac-acme.sh:v6
    build:
      context: .
    container_name: acme.sh
    user: "1000:1000"
    command: daemon
    environment:
      - TZ=America/Chicago
    volumes:
      - ./certs:/certs
      - ./hooks:/hooks
      - ./config:/acme.sh
    restart: unless-stopped